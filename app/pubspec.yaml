name: mobile_cloner
description: "Move everything from your old phone to the new one, and back it up to your computer."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations in Flutter 3.32.8.
  intl: 0.20.2

  cloner_core:
    path: ../packages/cloner_core
  photo_manager: ^3.12.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  path: ^1.9.1
  mime: ^1.0.6
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Arabic UI font (SIL OFL 1.1, assets/fonts/Tajawal-OFL.txt).
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
