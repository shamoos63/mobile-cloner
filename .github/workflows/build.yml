name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Flutter 3.32 is the last release that supports Android 6 (API 23).
  FLUTTER_VERSION: '3.32.8'

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: packages/cloner_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-cloner-android
          path: app/build/app/outputs/flutter-apk/*.apk

  windows:
    name: Windows
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-cloner-windows
          path: app/build/windows/x64/runner/Release/

  macos:
    name: macOS
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
          cd build/macos/Build/Products/Release && ditto -c -k --keepParent "mobile_cloner.app" ../../../../../mobile-cloner-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-cloner-macos
          path: app/mobile-cloner-macos.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-cloner-linux
          path: app/build/linux/x64/release/bundle/
